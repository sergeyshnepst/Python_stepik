from tkinter import *

root = Tk() # главное окно, влзможно так же называть window или app
root.mainloop() # запускает главный цикл событий для оборажения главного окна, постоянно слушает действия пользователя
root.title() # заголовок окна

Добавление иконки 
Вариант 1:
Если файл с иконкой находится в корневой папке приложения, то в параметрах мы можем указать только его название вместе с расширением:
root.iconbitmap("иконка python.ico")
              
Вариант 2:
Если файл с иконкой находится не в корневой папке приложения, то в параметрах через default  указываем к нему путь:
root.iconbitmap(r"C:\Users\user\Pictures\иконка python.ico")

Установка размера окна
root.geometry("300x250")
Чтобы изменить положение нашего окна, нужно передать необходимые значения также в метод geometry():
root.geometry("350x300+600+250") # "Ширина x Высота + координатаX + координатаY"
# чтобы получить размеры и позицию текущего окна
root.update_idletasks()
print(root.geometry())
# фиксированный размер окна
root.resizable(False, False) # изменение по оси X, изменение по оси Y (True или False)

# Лейбл
label = Label(root, text="Первая строка\nВторая строка\nТретья",
    bg="lightgray",
    fg="darkblue",
    font=("Comic Sans MS", 12, "bold"),
    justify=LEFT,
    width=30,
    height=4,
    anchor=NW,
    relief="ridge",
    padx=10,
    pady=5)
label.pack() # метод для размещения на экране

# добавление картинки
img = PhotoImage(file="python.gif")   # загружаем картинку
label_img = Label(root, image=img)    # создаём метку с картинкой
label_img.pack()


Если хочешь использовать PNG или JPG — нужна библиотека Pillow:
pip install Pillow
               
from PIL import Image, ImageTk
img = Image.open("python.png")
img = img.resize((100, 100))          # меняем размер
photo = ImageTk.PhotoImage(img)
label_img = Label(root, image=photo)
label_img.pack()


# Способы настройки виджетов
Способ 1. Через конструктор (при создании)
l = Label(root, text="Текст", width=20, height=5)

Способ 2. Через методы config() или configure() # синонимы
l = Label(root, text="Текст")
l.config(width=20, height=5) # Можно менять сразу несколько опций.

Способ 3. Как у словаря (через ключи)
l = Label(root, text="Текст")
l["text"] = "Новый текст"


# Кнопки - основные методы
1. config(option=value, ...) или configure(option=value, ...)
Что делает: Изменяет один или несколько параметров кнопки (текст, цвет, команду и т.д.)
btn.config(text="Новый текст", bg="red")
                  
2. cget(option)
Что делает: Возвращает текущее значение указанного параметра.
current_text = btn.cget("text")
print(current_text)
                  
3. invoke()
Что делает: Имитирует нажатие на кнопку. Выполняется функция, указанная в параметре command, как если бы пользователь реально кликнул по кнопке.
btn.invoke()  # программно "нажимает" кнопку
                  
4. flash()
Что делает: Заставляет кнопку кратковременно мигнуть (переключиться между обычным и активным состоянием). Полезно для привлечения внимания.
btn.flash()
                  
5. bind(sequence, func)
Что делает: Привязывает функцию к определённому событию (например, клик мыши, наведение, нажатие клавиши). Это позволяет реагировать на любые действия пользователя, не только на обычный клик.
btn.bind("<Enter>", lambda e: print("Мышь вошла"))
btn.bind("<Leave>", lambda e: print("Мышь ушла"))
                  
6. unbind(sequence)
Что делает: Удаляет привязку события, ранее установленную через bind().
btn.unbind("<Enter>")
                  
7. focus_set()
Что делает: Передаёт фокус ввода на эту кнопку. После этого можно, например, нажать её клавишей пробел или Enter (если кнопка в фокусе).
btn.focus_set()
                  
8. destroy()
Что делает: Полностью удаляет кнопку из окна. После этого виджет больше не существует.
btn.destroy()
                  
9. pack(), grid(), place()
Что делают: Размещают кнопку в окне с помощью одного из трёх менеджеров геометрии. Хотя это чаще называют методами размещения, технически это тоже методы виджета.
btn.pack(side=LEFT, padx=10)

# Дополнительные окна
# Кнопка для закрытия Всех окон
Button(root, text="Закрыть все", command=root.destroy).pack(pady=20)

# Автоматическое удаление. В данном случае через 5000 миллисекунд (5 секунд): 
extra_window = tk.Toplevel()
extra_window.after(5000, extra_window.destroy)  # Через 5000 миллисекунд

# модальное окно
Если нужно, чтобы второе окно блокировало ввод в главное (как диалог), используй grab_set().
win.grab_set()   # все события теперь только в это окно

# зависимость окна
Делает окно зависимым от главного: оно всегда поверх своего мастера и сворачивается/разворачивается вместе с ним.
win.transient(root)

# attributes() — специальные атрибуты
"-topmost" — поверх всех окон.
"-alpha" — прозрачность (от 0.0 до 1.0).
"-fullscreen" — полный экран.
"-toolwindow" — окно без иконки в панели задач (работает не везде).
win.attributes("-alpha", 0.8)        # полупрозрачное
win.attributes("-topmost", True)     # всегда сверху
win.attributes("-fullscreen", True)  # полноэкранный режим
